@if (isLoading()) {
  <main class="grid min-h-[calc(100dvh-8.5rem)] place-items-center bg-background" aria-label="Beitrag wird geladen"><span class="size-10 animate-spin rounded-full border-4 border-accent border-t-primary" aria-hidden="true"></span></main>
} @else if (post(); as article) {
  <main class="px-5 pb-8 pt-5"><a routerLink="/dashboard" class="inline-flex min-h-11 items-center text-sm font-bold text-primary">← Zur Übersicht</a><article class="mt-3"><time class="text-sm font-semibold text-primary">{{ formatDate(article.publishedAt) }}</time><h1 class="mt-2 text-3xl font-bold leading-tight tracking-tight">{{ article.title }}</h1><p class="mt-3 text-lg leading-7 text-muted">{{ article.subtitle }}</p>@if (article.imageUrl) { <img class="mt-6 h-56 w-full rounded-2xl object-cover shadow-card" [src]="article.imageUrl" [alt]="article.title" /> }<div class="news-content mt-7 text-base leading-7 text-foreground" [innerHTML]="article.bodyHtml"></div></article></main>
} @else {
  <main class="px-5 pb-8 pt-8"><h1 class="text-2xl font-bold">Beitrag nicht verfügbar</h1><p class="mt-2 text-muted">Dieser Beitrag ist nicht mehr sichtbar oder existiert nicht.</p><a routerLink="/dashboard" class="mt-5 inline-flex min-h-11 items-center font-bold text-primary">Zur Übersicht</a></main>
}
