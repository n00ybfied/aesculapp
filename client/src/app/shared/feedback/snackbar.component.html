@if (message(); as currentMessage) {
  <div class="pointer-events-none fixed inset-x-0 bottom-[calc(5.5rem+env(safe-area-inset-bottom))] z-30 mx-auto w-full max-w-[500px] px-5">
    <div
      class="pointer-events-auto flex touch-pan-y items-center gap-3 rounded-2xl border bg-surface p-4 shadow-card transition-[transform,opacity] duration-200 ease-out"
      [class.border-danger]="currentMessage.kind === 'error'"
      [class.text-danger]="currentMessage.kind === 'error'"
      [class.border-primary]="currentMessage.kind !== 'error'"
      [class.opacity-0]="!isVisible()"
      [style.transform]="transform()"
      role="status"
      aria-live="polite"
      (pointerdown)="startDrag($event)"
      (pointermove)="drag($event)"
      (pointerup)="endDrag()"
      (pointercancel)="endDrag()"
    >
      <ng-icon name="lucideCircleAlert" size="1.25rem" aria-hidden="true" />
      <p class="min-w-0 flex-1 text-sm font-medium leading-5 text-foreground">{{ currentMessage.text }}</p>
      <button
        type="button"
        class="grid size-9 shrink-0 place-items-center rounded-lg text-foreground hover:bg-accent focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
        (click)="dismiss()"
        aria-label="Meldung schließen"
      >
        <ng-icon name="lucideX" size="1.125rem" aria-hidden="true" />
      </button>
    </div>
  </div>
}
