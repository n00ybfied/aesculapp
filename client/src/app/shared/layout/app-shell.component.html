<div class="mx-auto min-h-dvh w-full max-w-[500px] bg-background text-foreground shadow-[0_0_40px_rgb(23_36_33_/_8%)]">
  <header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-border bg-surface/95 px-5 backdrop-blur" aria-label="Kopfbereich">
    <button
      type="button"
      class="grid size-11 place-items-center rounded-xl text-foreground transition hover:bg-accent focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
      (click)="openNavigation()"
      aria-label="Hauptmenü öffnen"
      [attr.aria-expanded]="navigationOpen()"
      aria-controls="main-navigation"
    >
      <ng-icon name="lucideMenu" size="1.5rem" aria-hidden="true" />
    </button>
    <a routerLink="/dashboard" class="rounded-lg px-2 py-1 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary" aria-label="Zur Übersicht">
      <img [ngSrc]="theme.logoPath" width="530" height="174" class="h-auto w-34" [alt]="theme.pharmacyName" priority />
    </a>
    <a routerLink="/profil" class="grid size-11 place-items-center overflow-hidden rounded-full bg-accent text-sm font-bold text-primary focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary" aria-label="Mein Profil">
      @if (profile()?.profileImageUrl; as imageUrl) {
        <img [src]="imageUrl" class="size-full object-cover" alt="" />
      } @else {
        {{ profileInitials() }}
      }
    </a>
  </header>

  @if (navigationVisible()) {
    <div class="fixed inset-0 z-40 bg-foreground/35 transition-opacity duration-200 ease-out" [class.opacity-0]="!navigationOpen()" [class.pointer-events-none]="!navigationOpen()" (click)="closeNavigation()" aria-hidden="true"></div>
    <aside id="main-navigation" class="fixed inset-y-0 left-0 z-50 flex w-[min(21rem,calc(100vw-2rem))] flex-col bg-surface px-5 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-[max(1.25rem,env(safe-area-inset-top))] shadow-2xl transition-transform duration-200 ease-out" [class.-translate-x-full]="!navigationOpen()" [class.pointer-events-none]="!navigationOpen()" [attr.aria-hidden]="!navigationOpen()" [attr.inert]="navigationOpen() ? null : ''" aria-label="Hauptmenü">
      <div class="flex items-center justify-between">
        <img [ngSrc]="theme.logoPath" width="530" height="174" class="h-auto w-42" [alt]="theme.pharmacyName" />
        <button type="button" class="grid size-11 place-items-center rounded-xl hover:bg-accent focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary" (click)="closeNavigation()" aria-label="Hauptmenü schließen">
          <ng-icon name="lucideX" size="1.5rem" aria-hidden="true" />
        </button>
      </div>
      <nav class="mt-8 space-y-2" aria-label="Seitennavigation">
        <a routerLink="/dashboard" routerLinkActive="bg-accent text-primary" [routerLinkActiveOptions]="{ exact: true }" class="flex min-h-12 items-center rounded-xl px-4 font-semibold hover:bg-accent" (click)="closeNavigation()">Übersicht</a>
        <a routerLink="/punkte" routerLinkActive="bg-accent text-primary" class="flex min-h-12 items-center rounded-xl px-4 font-semibold hover:bg-accent" (click)="closeNavigation()">Punkte &amp; Prämien</a>
        <a routerLink="/scanner" routerLinkActive="bg-accent text-primary" class="flex min-h-12 items-center rounded-xl px-4 font-semibold hover:bg-accent" (click)="closeNavigation()">Rechnung scannen</a>
        <a routerLink="/profil" routerLinkActive="bg-accent text-primary" class="flex min-h-12 items-center rounded-xl px-4 font-semibold hover:bg-accent" (click)="closeNavigation()">Mein Profil</a>
      </nav>
      <button type="button" class="mt-auto min-h-12 rounded-xl border border-border px-4 text-left font-semibold text-muted hover:bg-accent" (click)="logout()">Abmelden</button>
    </aside>
  }

  <div class="min-h-[calc(100dvh-8.5rem)] pb-[calc(5.5rem+env(safe-area-inset-bottom))]">
    <router-outlet />
  </div>

  <app-snackbar />

  <nav class="fixed bottom-0 left-1/2 z-20 grid w-full max-w-[500px] -translate-x-1/2 grid-cols-3 items-end border-t border-border bg-surface px-4 pb-[max(0.5rem,env(safe-area-inset-bottom))] pt-2" aria-label="Schnellnavigation">
    <a routerLink="/dashboard" routerLinkActive="text-primary" [routerLinkActiveOptions]="{ exact: true }" class="justify-self-start flex min-h-14 min-w-16 flex-col items-center justify-center gap-1 rounded-xl px-2 text-xs font-semibold text-muted focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary">
      <ng-icon name="lucideHouse" size="1.25rem" aria-hidden="true" />
      Home
    </a>
    <a
      routerLink="/scanner"
      routerLinkActive
      #scannerLink="routerLinkActive"
      class="justify-self-center -mt-7 flex min-h-18 min-w-18 flex-col items-center justify-center gap-1 rounded-full bg-primary px-3 text-xs font-bold text-on-primary shadow-soft transition-colors focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary"
      [class.bg-primary-strong]="scannerLink.isActive"
      [class.ring-4]="scannerLink.isActive"
      [class.ring-accent]="scannerLink.isActive"
      [attr.aria-current]="scannerLink.isActive ? 'page' : null"
    >
      <ng-icon name="lucideQrCode" size="1.5rem" aria-hidden="true" />
      Scannen
    </a>
    <a routerLink="/punkte" routerLinkActive="text-primary" class="justify-self-end flex min-h-14 min-w-16 flex-col items-center justify-center gap-1 rounded-xl px-2 text-xs font-semibold text-muted focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-primary">
      <ng-icon name="lucideGem" size="1.25rem" aria-hidden="true" />
      Prämien
    </a>
  </nav>
</div>
