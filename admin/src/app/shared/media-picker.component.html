<button type="button" class="open" (click)="show()">Medien auswählen</button>
@if (open()) {<div class="backdrop" (click)="open.set(false)"><section class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()"><header><strong>Medien auswählen</strong><button type="button" (click)="open.set(false)">Schließen</button></header><label class="drop" (dragover)="$event.preventDefault()" (drop)="drop($event)"><input type="file" multiple accept="image/jpeg,image/png,image/webp" (change)="upload($event)" /><strong>{{ uploading() ? 'Upload läuft …' : 'Neue Bilder hier ablegen oder auswählen' }}</strong><small>Mehrfachauswahl möglich</small></label><div class="grid">@for (item of media(); track item.id) {<button type="button" (click)="choose(item)"><img [src]="item.url" [alt]="item.name" /><span>{{ item.name }}</span></button>}</div></section></div>}
