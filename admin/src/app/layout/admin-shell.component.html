<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">
      @if (branding().logoUrl; as logoUrl) {
        <img [src]="logoUrl" alt="Logo der Stadtapotheke Trofaiach" />
      } @else {
        <span aria-label="Logo-Platzhalter">LOGO</span>
      }
    </a>
    <p class="tenant">Stadtapotheke Trofaiach</p>
    <nav aria-label="Hauptnavigation">
      <a routerLink="/dashboard" routerLinkActive="active">Übersicht</a>
      <a routerLink="/inhalte" routerLinkActive="active">Inhalte</a>
      <a routerLink="/praemien" routerLinkActive="active">Prämien</a>
      <a routerLink="/einloesungen" routerLinkActive="active">Einlösungen</a>
      <a routerLink="/buchungen" routerLinkActive="active">Buchungen</a>
      <span aria-disabled="true">Benutzer <small>demnächst</small></span>
      <a routerLink="/einstellungen" routerLinkActive="active">Einstellungen</a>
    </nav>
  </aside>

  <div class="main-area">
    <header>
      <div><p class="eyebrow">Apothekenportal</p><h1>Verwaltung</h1></div>
      <div class="account"><span>{{ displayName() }}</span><button type="button" (click)="logout()">Abmelden</button></div>
    </header>
    <main><router-outlet /></main>
  </div>
</div>
