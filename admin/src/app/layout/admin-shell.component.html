<div class="shell" [class.navigation-open]="navigationOpen()">
  <button type="button" class="menu-backdrop" (click)="closeNavigation()" aria-label="Menü schließen"></button>
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">
      @if (branding().logoUrl; as logoUrl) {
        <img [src]="logoUrl" alt="Logo der Stadtapotheke Trofaiach" />
      } @else {
        <span aria-label="Logo-Platzhalter">LOGO</span>
      }
    </a>
    <p class="tenant">Stadtapotheke Trofaiach</p>
    <nav aria-label="Hauptnavigation">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeNavigation()">Übersicht</a>
      <a routerLink="/inhalte" routerLinkActive="active" (click)="closeNavigation()">Inhalte</a>
      <a routerLink="/praemien" routerLinkActive="active" (click)="closeNavigation()">Prämien</a>
      <a routerLink="/einloesungen" routerLinkActive="active" (click)="closeNavigation()">Einlösungen</a>
      <a routerLink="/buchungen" routerLinkActive="active" (click)="closeNavigation()">Buchungen</a>
      <span aria-disabled="true">Benutzer <small>demnächst</small></span>
      <a routerLink="/einstellungen" routerLinkActive="active" (click)="closeNavigation()">Einstellungen</a>
    </nav>
  </aside>

  <div class="main-area">
    <header>
      <div class="header-title"><button type="button" class="menu-toggle" (click)="toggleNavigation()" aria-label="Hauptmenü öffnen" [attr.aria-expanded]="navigationOpen()">☰</button><div><p class="eyebrow">Apothekenportal</p><h1>Verwaltung</h1></div></div>
      <div class="account"><span>{{ displayName() }}</span><button type="button" (click)="logout()">Abmelden</button></div>
    </header>
    <main><router-outlet /></main>
  </div>
</div>
