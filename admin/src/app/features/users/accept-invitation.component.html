<main class="invite-page">
  <section class="card" aria-labelledby="accept-invitation-title">
    <p class="eyebrow">APOTHEKENPORTAL</p>
    <h1 id="accept-invitation-title">Einladung annehmen</h1>
    <p class="intro">Legen Sie Ihr persönliches Passwort für den Zugang fest.</p>

    @if (isAccepted()) {
      <div class="success" role="status">
        Ihr Zugang wurde eingerichtet. Sie können sich jetzt anmelden.
      </div>
      <button type="button" (click)="goToLogin()">Zur Anmeldung</button>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          <span>Neues Passwort</span>
          <input type="password" formControlName="password" autocomplete="new-password" />
        </label>
        <label>
          <span>Passwort wiederholen</span>
          <input type="password" formControlName="passwordConfirmation" autocomplete="new-password" />
        </label>
        <p class="hint">Mindestens 10 Zeichen.</p>
        @if (error(); as message) { <p class="error" role="alert">{{ message }}</p> }
        <button type="submit" [disabled]="isSubmitting() || token === null">{{ isSubmitting() ? 'Zugang wird eingerichtet …' : 'Zugang einrichten' }}</button>
      </form>
    }
    <a routerLink="/login">Zur Anmeldung</a>
  </section>
</main>
