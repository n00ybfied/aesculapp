<section><a routerLink="/inhalte" class="back">← Zu allen Beiträgen</a><p class="eyebrow">Inhalte</p><h2>{{ isEdit ? 'Beitrag bearbeiten' : 'Neuen Beitrag anlegen' }}</h2>
  @if (isLoading()) { <p>Beitrag wird geladen …</p> } @else { <form (ngSubmit)="save()"><div class="grid"><label>Titel<input name="title" [(ngModel)]="title" required /></label><label>Untertitel<input name="subtitle" [(ngModel)]="subtitle" required /></label><label>Beitragsdatum<input name="publishedAt" [(ngModel)]="publishedAt" type="datetime-local" required /></label><label class="check"><input name="visible" [(ngModel)]="isVisible" type="checkbox" /> Beitrag sichtbar</label><label>Anzeigen ab <small>(optional)</small><input name="showFrom" [(ngModel)]="showFrom" type="datetime-local" /></label><label>Anzeigen bis <small>(optional)</small><input name="showUntil" [(ngModel)]="showUntil" type="datetime-local" /></label></div>
  <div class="editor-field"><span>Detailtext</span><div class="toolbar" aria-label="Textformatierung"><button type="button" (click)="run('bold')"><strong>Fett</strong></button><button type="button" (click)="run('italic')"><em>Kursiv</em></button><button type="button" (click)="run('insertUnorderedList')">Liste</button><button type="button" (click)="run('insertOrderedList')">Nummeriert</button><button type="button" (click)="createLink()">Link</button><label class="image-button">Bild einfügen<input type="file" accept="image/jpeg,image/png,image/webp" (change)="insertContentImage($event)" /></label></div><div #editor class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Detailtext"></div></div>
  <div class="upload"><span>Beitragsbild <small>(optional)</small></span><label class="dropzone" (dragover)="dragOver($event)" (drop)="dropImage($event)"><input type="file" accept="image/jpeg,image/png,image/webp" (change)="selectImage($event)" /><span>Datei hier ablegen oder auswählen</span><small>PNG, JPEG oder WebP · max. 5 MB</small></label>@if(imagePreviewUrl();as preview){<div class="preview"><img [src]="preview" alt="Vorschau des Beitragsbilds" /><button type="button" (click)="removeImage()">Bild entfernen</button></div>}</div>
  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }<button class="save" [disabled]="isSaving()">{{ isSaving() ? 'Speichert …' : 'Beitrag speichern' }}</button></form> }
</section>
