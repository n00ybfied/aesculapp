<section><a routerLink="/inhalte" class="back">← Zu allen Beiträgen</a><p class="eyebrow">Inhalte</p><h2>{{ isEdit ? 'Beitrag bearbeiten' : 'Neuen Beitrag anlegen' }}</h2><form (ngSubmit)="save()"><div class="grid"><label>Titel<input name="title" [(ngModel)]="title" required /></label><label>Untertitel<input name="subtitle" [(ngModel)]="subtitle" required /></label><label>Beitragsdatum<input name="publishedAt" [(ngModel)]="publishedAt" type="datetime-local" required /></label><label class="check"><input name="visible" [(ngModel)]="isVisible" type="checkbox" /> Beitrag sichtbar</label><label>Anzeigen ab<input name="showFrom" [(ngModel)]="showFrom" type="datetime-local" /></label><label>Anzeigen bis<input name="showUntil" [(ngModel)]="showUntil" type="datetime-local" /></label></div><div class="editor-field"><div class="editor-label">Detailtext</div><app-rich-text-editor [(value)]="bodyHtml" /></div><div class="upload"><span>Beitragsbild <small>(optional)</small></span><app-media-picker (selected)="selectCoverMedia($event)" />@if(imagePreviewUrl();as preview){<div class="preview"><img [src]="preview" alt="Vorschau des Beitragsbilds" /><button type="button" (click)="removeImage()">Bild entfernen</button></div>}</div>@if(error()){<p class="error">{{error()}}</p>}<button class="save" [disabled]="isSaving()">Beitrag speichern</button></form></section>
