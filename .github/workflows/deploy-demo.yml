name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aesculapp-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy demo
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            admin/package-lock.json

      - name: Build customer app
        working-directory: client
        run: |
          npm ci
          npm run build:demo

      - name: Build admin portal
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_mysql
          tools: composer:v2

      - name: Install production PHP dependencies
        working-directory: server
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-scripts --no-interaction

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy build artifacts and warm cache
        run: |
          retry() {
            local attempt=1
            local max_attempts=3

            until "$@"; do
              local exit_code=$?

              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$exit_code"
              fi

              echo "Attempt $attempt failed with exit code $exit_code. Retrying in 5s..."
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          ssh_args=(
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o TCPKeepAlive=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
          )
          rsync_ssh=$(printf 'ssh %q ' "${ssh_args[@]}")
          rsync_ssh=${rsync_ssh% }

          retry ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_ROOT/client' '$DEPLOY_ROOT/admin' '$DEPLOY_ROOT/server'"
          retry rsync -az --delete -e "$rsync_ssh" client/dist/aesculapp/browser/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/client/"
          retry rsync -az --delete -e "$rsync_ssh" admin/dist/admin/browser/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/admin/"
          retry rsync -az --delete -e "$rsync_ssh" \
            --exclude='.env.local' \
            --exclude='config/jwt/' \
            --exclude='var/' \
            --exclude='public/uploads/' \
            server/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/server/"
          retry ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_ROOT/server' && mkdir -p var/cache public/uploads/rewards"
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_ROOT/server' && APP_ENV=prod APP_DEBUG=0 php bin/console doctrine:migrations:migrate --no-interaction && APP_ENV=prod APP_DEBUG=0 php bin/console cache:clear --no-warmup"
