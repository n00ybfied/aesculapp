name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aesculapp-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy demo
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            admin/package-lock.json

      - name: Build customer app
        working-directory: client
        run: |
          npm ci
          npm run build:demo

      - name: Build admin portal
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_mysql
          tools: composer:v2

      - name: Install production PHP dependencies
        working-directory: server
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-scripts --no-interaction

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          cat <<EOF > ~/.ssh/config
          Host $DEPLOY_HOST
            BatchMode yes
            ConnectTimeout 10
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ControlMaster auto
            ControlPersist 60s
            ControlPath ~/.ssh/control-%C
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy build artifacts
        run: |
          retry() {
            local attempts="$1"
            local delay_seconds="$2"
            shift 2

            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" -ge "$attempts" ]; then
                return 1
              fi

              echo "Attempt $attempt failed, retrying in ${delay_seconds}s..."
              attempt=$((attempt + 1))
              sleep "$delay_seconds"
            done
          }

          retry 3 5 ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_ROOT/client' '$DEPLOY_ROOT/admin' '$DEPLOY_ROOT/server'"
          retry 3 5 rsync -az --delete client/dist/aesculapp/browser/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/client/"
          retry 3 5 rsync -az --delete admin/dist/admin/browser/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/admin/"
          retry 3 5 rsync -az --delete \
            --exclude='.env.local' \
            --exclude='config/jwt/' \
            --exclude='var/' \
            --exclude='public/uploads/' \
            server/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/server/"

      - name: Run database migrations and warm cache
        run: |
          retry() {
            local attempts="$1"
            local delay_seconds="$2"
            shift 2

            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" -ge "$attempts" ]; then
                return 1
              fi

              echo "Attempt $attempt failed, retrying in ${delay_seconds}s..."
              attempt=$((attempt + 1))
              sleep "$delay_seconds"
            done
          }

          retry 3 5 ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_ROOT/server' && mkdir -p var/cache public/uploads/rewards && APP_ENV=prod APP_DEBUG=0 php bin/console doctrine:migrations:migrate --no-interaction && APP_ENV=prod APP_DEBUG=0 php bin/console cache:clear --no-warmup"
