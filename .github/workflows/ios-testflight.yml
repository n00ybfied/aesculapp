name: iOS TestFlight build

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Signierte IPA nach App Store Connect hochladen'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Sign pharmacy iOS test app
    runs-on: macos-26
    timeout-minutes: 60
    env:
      AESCULAPP_NATIVE_TARGET: ios-test
      BUNDLE_ID: at.floatbox.aesculapp.sta.test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install signing certificate and profile
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_TESTFLIGHT_PROFILE_BASE64: ${{ secrets.IOS_TESTFLIGHT_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$IOS_DISTRIBUTION_P12_BASE64" || -z "$IOS_DISTRIBUTION_P12_PASSWORD" || -z "$IOS_TESTFLIGHT_PROFILE_BASE64" ]]; then
            echo 'iOS-Signier-Secrets fehlen.' >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/testflight.mobileprovision"
          profile_plist="$RUNNER_TEMP/testflight-profile.plist"
          keychain_path="$RUNNER_TEMP/testflight-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_TESTFLIGHT_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          if [[ "$application_id" != "$team_id.$BUNDLE_ID" ]]; then
            echo 'Das Provisioning Profile gehört nicht zur iOS-Test-App.' >&2
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_directory"
          cp "$profile_path" "$profile_directory/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$team_id" >> "$GITHUB_ENV"

      - name: Build pharmacy test client
        working-directory: client
        run: |
          npm ci
          npm run build:apotheke-native
          npx cap sync ios

      - name: Archive signed iOS app
        working-directory: client/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AesculApp-TestFlight.xcarchive" \
            IOS_TEAM_ID="$IOS_TEAM_ID" \
            IOS_PROFILE_NAME="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export signed IPA
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $IOS_PROFILE_NAME" "$export_options"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/AesculApp-TestFlight.xcarchive" \
            -exportPath "$RUNNER_TEMP/testflight-export" \
            -exportOptionsPlist "$export_options"

      - name: Save signed IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aesculapp-ios-testflight-${{ github.run_number }}
          path: ${{ runner.temp }}/testflight-export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_STORE_CONNECT_KEY_ID" || -z "$APP_STORE_CONNECT_ISSUER_ID" || -z "$APP_STORE_CONNECT_P8_BASE64" ]]; then
            echo 'App-Store-Connect-Secrets fehlen; die signierte IPA wurde nur als Artifact gespeichert.' >&2
            exit 1
          fi
          if [[ ! "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]+$ ]]; then
            echo 'Die App-Store-Connect-Key-ID hat ein ungültiges Format.' >&2
            exit 1
          fi

          key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_directory"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          ipa_files=("$RUNNER_TEMP"/testflight-export/*.ipa)
          if [[ ${#ipa_files[@]} -ne 1 || ! -f "${ipa_files[0]}" ]]; then
            echo 'Es wurde nicht genau eine signierte IPA gefunden.' >&2
            exit 1
          fi
          xcrun altool --upload-app -f "${ipa_files[0]}" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
