name: Deploy Apotheke test

on:
  push:
    branches: [apotheke-test]
  workflow_dispatch:

concurrency:
  group: aesculapp-apotheke-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: apotheke-test
    permissions:
      contents: read
    env:
      DEPLOY_HOST: www21.world4you.com
      DEPLOY_USER: ftp1646665
      DEPLOY_HOME: /home/.sites/95/site1646665

    steps:
      - name: Verify deployment is enabled
        env:
          DEPLOY_ENABLED: ${{ vars.APOTHEKE_DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" != 'true' ]; then
            echo '::error::Set APOTHEKE_DEPLOY_ENABLED=true as a repository or apotheke-test environment variable before deploying.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            admin/package-lock.json

      - name: Select pharmacy API for both frontends
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(grep -rlZ --include='*.ts' 'https://api.aesculapp.floatbox.at/api/v1' client/src admin/src)
          test "${#files[@]}" -gt 0
          sed -i 's#https://api.aesculapp.floatbox.at/api/v1#https://api.stadtapotheke-trofaiach.at/api/v1#g' "${files[@]}"
          if grep -r --include='*.ts' -q 'https://api.aesculapp.floatbox.at/api/v1' client/src admin/src; then
            echo 'Demo API address remains in frontend sources' >&2
            exit 1
          fi

      - name: Build customer app
        working-directory: client
        run: |
          npm ci
          npm run build:demo

      - name: Build admin portal
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_mysql
          tools: composer:v2

      - name: Install production PHP dependencies
        working-directory: server
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-scripts --no-interaction

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.APOTHEKE_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.APOTHEKE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts
          printf '%s\n' 'Host www21.world4you.com' '  HostName www21.world4you.com' '  User ftp1646665' '  IdentityFile ~/.ssh/id_rsa' '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  MACs hmac-sha2-256' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Check target configuration
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" "test -f '$DEPLOY_HOME/web/aesculapp-api/.env.local' && test -d '$DEPLOY_HOME/web/aesculapp-api/config/jwt' && test -f '$DEPLOY_HOME/web/aesculapp-api/.htaccess' && test -d '$DEPLOY_HOME/web/aesculapp-api/public/uploads' && test -d '$DEPLOY_HOME/web/aesculapp-client' && test -d '$DEPLOY_HOME/web/aesculapp-admin'"
          test "$(curl -fsS --max-time 15 https://api.stadtapotheke-trofaiach.at/aesculapp-docroot.txt)" = 'aesculapp-api-public-v1'

      - name: Deploy build artifacts
        run: |
          set -euo pipefail
          rsync -az --delete client/dist/aesculapp/browser/ "$DEPLOY_HOST:$DEPLOY_HOME/web/aesculapp-client/"
          rsync -az --delete admin/dist/admin/browser/ "$DEPLOY_HOST:$DEPLOY_HOME/web/aesculapp-admin/"
          rsync -az --delete \
            --exclude='/.env.local' \
            --exclude='/config/jwt/' \
            --exclude='/var/' \
            --exclude='/public/uploads/' \
            --exclude='/public/.htaccess' \
            --exclude='/public/aesculapp-docroot.txt' \
            --exclude='/.htaccess' \
            --exclude='/uploads/' \
            server/ "$DEPLOY_HOST:$DEPLOY_HOME/web/aesculapp-api/"
          rsync -az ops/world4you/api-root/.htaccess "$DEPLOY_HOST:$DEPLOY_HOME/web/aesculapp-api/.htaccess"
          rsync -az ops/world4you/api/ "$DEPLOY_HOST:$DEPLOY_HOME/web/aesculapp-api/public/"
          rsync -az ops/world4you/spa/.htaccess "$DEPLOY_HOST:$DEPLOY_HOME/web/aesculapp-client/.htaccess"
          rsync -az ops/world4you/spa/.htaccess "$DEPLOY_HOST:$DEPLOY_HOME/web/aesculapp-admin/.htaccess"
          ssh "$DEPLOY_HOST" "mkdir -p '$DEPLOY_HOME/web/aesculapp-api/public/uploads' '$DEPLOY_HOME/web/aesculapp-api/var/cache' && test -d '$DEPLOY_HOME/web/aesculapp-api/public/uploads' && test ! -L '$DEPLOY_HOME/web/aesculapp-api/public/uploads'"
          rsync -az ops/world4you/upload-protection/.htaccess "$DEPLOY_HOST:$DEPLOY_HOME/web/aesculapp-api/public/uploads/.htaccess"
          rsync -az server/public/uploads/demo/ "$DEPLOY_HOST:$DEPLOY_HOME/web/aesculapp-api/public/uploads/demo/"

      - name: Run database migrations and clear cache
        run: |
          ssh "$DEPLOY_HOST" "cd '$DEPLOY_HOME/web/aesculapp-api' && APP_ENV=prod APP_DEBUG=0 php84 bin/console doctrine:migrations:migrate --no-interaction && APP_ENV=prod APP_DEBUG=0 php84 bin/console cache:clear --no-warmup"

      - name: Verify public API
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://api.stadtapotheke-trofaiach.at/api/health | jq -e '.status == "ok" and .service == "aesculapp-api"'
